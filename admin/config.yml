backend:
  name: github
  repo: Blueweyl/hype-district-plaridel
  branch: master
  base_url: https://oauth-proxy-blush.vercel.app
  auth_endpoint: api/auth

media_folder: "content/updates/media"
public_folder: "content/updates/media"

collections:
  - name: "updates"
    label: "Updates"
    label_singular: "Update"
    folder: "content/updates"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{platform}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title / Caption", name: "title", widget: "string" }
      - label: "Platform"
        name: "platform"
        widget: "select"
        options:
          - { label: "Facebook", value: "facebook" }
          - { label: "Instagram", value: "instagram" }
          - { label: "TikTok", value: "tiktok" }
      - label: "Post Link"
        name: "link"
        widget: "string"
        required: false
        hint: "Paste the Facebook, Instagram, or TikTok post URL here to automatically embed it (recommended)."
      - label: "Photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Only needed if you're not pasting a post link above."
      - label: "Video File"
        name: "video"
        widget: "file"
        required: false
        hint: "Only needed if you're not pasting a post link above."
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"

  - name: "reservations"
    label: "Reservations"
    label_singular: "Reservation"
    folder: "content/reservations"
    create: false
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "firstName"
    summary: "{{date}} {{time}} — {{serviceName}} — {{firstName}} (…{{phoneLast4}})"
    sortable_fields: ["date", "time"]
    fields:
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Time", name: "time", widget: "string" }
      - label: "Service ID(s)"
        name: "serviceId"
        widget: "string"
        hint: "Comma-separated if the customer picked more than one service (e.g. \"classic-haircut-fade,full-grooming\")."
      - label: "Service Name"
        name: "serviceName"
        widget: "string"
        hint: "Combined with \" + \" for multi-service bookings, e.g. \"Classic Haircuts & Fades + Full Grooming Experience\"."
      - { label: "Price (PHP)", name: "price", widget: "number", hint: "Sum of all selected services." }
      - { label: "First Name", name: "firstName", widget: "string" }
      - { label: "Phone (last 4)", name: "phoneLast4", widget: "string" }
      - label: "Payment Provider"
        name: "paymentProvider"
        widget: "select"
        required: false
        options:
          - { label: "Stripe (Card)", value: "stripe" }
          - { label: "PayMongo (GCash) — dormant", value: "paymongo" }
          - { label: "GCash (Manual Transfer)", value: "gcash_manual" }
      - { label: "Provider Session ID", name: "providerSessionId", widget: "string", required: false }
      - label: "Status"
        name: "status"
        widget: "select"
        required: false
        hint: "GCash manual-transfer bookings start as payment_pending until staff approve/reject the screenshot in SukiDesk."
        options:
          - { label: "Confirmed", value: "confirmed" }
          - { label: "Payment Pending", value: "payment_pending" }
          - { label: "Payment Rejected", value: "payment_rejected" }
      - { label: "Confirmed At", name: "confirmedAt", widget: "datetime" }
      - { label: "Status Updated At", name: "statusUpdatedAt", widget: "datetime", required: false }
